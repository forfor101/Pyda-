<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pyda Movers & Logistics</title>
    <script type="text/javascript">
      // Single Page Application redirect script for GitHub Pages
      // Redirects 404s on subpaths back to the root index.html while preserving the route and query parameters
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h2>Redirecting to Pyda Movers & Logistics...</h2>
    <p style="color: #94a3b8; font-size: 14px;">If you are not redirected automatically, <a href="/" style="color: #f59e0b;">click here</a>.</p>
  </body>
</html>
